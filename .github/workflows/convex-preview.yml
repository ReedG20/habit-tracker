# A throwaway Convex deployment per PR branch, so a reviewer can point a dev
# build at the branch's backend. Needs a Preview Deploy Key (Convex Pro) in the
# CONVEX_DEPLOY_KEY_PREVIEW repository secret; without it the job is skipped.
name: Convex preview

on:
  pull_request:

concurrency:
  group: convex-preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy preview backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
    steps:
      - name: Check for a preview deploy key
        id: key
        run: echo "present=${{ env.CONVEX_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.key.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - if: steps.key.outputs.present == 'true'
        run: bun install --frozen-lockfile

      # With a preview key, `convex deploy` names the deployment after the
      # branch and prints its URL. Env vars are copied from prod's defaults.
      - if: steps.key.outputs.present == 'true'
        id: deploy
        run: |
          bunx convex deploy --yes --cmd 'echo "url=$EXPO_PUBLIC_CONVEX_URL" >> "$GITHUB_OUTPUT"' \
            --cmd-url-env-var-name EXPO_PUBLIC_CONVEX_URL

      - if: steps.key.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Convex preview backend for this branch: \`${url}\`\n\nPoint a dev build at it with \`EXPO_PUBLIC_CONVEX_URL=${url}\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('Convex preview backend'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
