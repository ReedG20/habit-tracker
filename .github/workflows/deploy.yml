# Push to main → the backend goes to production, and the app goes to the
# `preview` channel (your internal EAS build). Production users only get the new
# JS when you run the Release workflow (release.yml).
#
# In order:
#   1. Convex backend to production. Backend first, and ahead of any client:
#      functions must stay compatible with the bundle production is running.
#   2. The same backend to the shared dev deployment, which the preview build
#      talks to. Without it, a preview update that calls a new function crashes
#      on launch against whatever a laptop last pushed there.
#   3. Preview: an OTA update if a preview build has this native fingerprint,
#      otherwise a new internal preview build.
#   4. Production: nothing, unless no production build has this native
#      fingerprint, in which case one is built and submitted to TestFlight.
#
# Secrets: EXPO_TOKEN (expo.dev → Access tokens), CONVEX_DEPLOY_KEY (Convex →
# prod deployment → Deploy keys, `deployment:deploy` only) and
# CONVEX_DEPLOY_KEY_DEV (the same, on the shared dev deployment). EXPO_PUBLIC_*
# values come from the EAS environment named by --environment.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend, update preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Check secrets
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "EXPO_TOKEN secret is not set" >&2; exit 1; }
          [ -n "$CONVEX_DEPLOY_KEY" ] || { echo "CONVEX_DEPLOY_KEY secret is not set" >&2; exit 1; }
          bunx eas-cli@latest whoami

      - name: Deploy Convex backend
        run: bunx convex deploy --yes

      # Before anything reaches the preview build, so its bundle never runs
      # ahead of its backend. A missing key stops the job here, after
      # production is deployed but before preview is touched.
      - name: Deploy Convex backend to the shared dev deployment
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: |
          [ -n "$CONVEX_DEPLOY_KEY" ] || { echo "CONVEX_DEPLOY_KEY_DEV secret is not set; not updating preview" >&2; exit 1; }
          case "$CONVEX_DEPLOY_KEY" in
            dev:*) ;;
            *) echo "CONVEX_DEPLOY_KEY_DEV must be a dev deployment's deploy key (dev:...)" >&2; exit 1 ;;
          esac
          bunx convex deploy --yes

      - name: Look for builds with this native fingerprint
        id: native
        env:
          EXPO_DEBUG: '1'
        run: |
          echo "preview=$(scripts/eas-has-build.sh preview)" >> "$GITHUB_OUTPUT"
          echo "production=$(scripts/eas-has-build.sh production)" >> "$GITHUB_OUTPUT"

      # The update records this commit; Release reads it back to ship the same code.
      - name: Publish OTA update to preview
        if: steps.native.outputs.preview == 'true'
        run: |
          bunx eas-cli@latest update --platform ios --channel preview --environment preview \
            --message "$(git log -1 --pretty=%s)" --non-interactive

      - name: Build preview (internal)
        if: steps.native.outputs.preview == 'false'
        run: |
          bunx eas-cli@latest build --platform ios --profile preview \
            --no-wait --non-interactive --message "$(git log -1 --pretty=%s)"

      # A native change needs a store build either way; it carries this commit's
      # JS inside it, so it doubles as that release once it's through TestFlight.
      - name: Build production and submit to TestFlight
        if: steps.native.outputs.production == 'false'
        run: |
          bunx eas-cli@latest build --platform ios --profile production \
            --auto-submit --no-wait --non-interactive \
            --message "$(git log -1 --pretty=%s)"
