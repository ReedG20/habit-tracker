# PR checks. Deploys are not here: pushes to main run .eas/workflows/deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Typed routes and expo-env.d.ts are generated, not committed; tsc needs them.
      - run: bunx expo customize tsconfig.json

      - run: bun run lint
      - run: bunx prettier --check src convex
      - run: bun run typecheck
      - run: bun run test
